name: CI

on:
  push:
    branches: [ feature/devops ]
  pull_request:
    branches: [ feature/devops ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code from feature/devops branch
      uses: actions/checkout@v4
      with:
        ref: feature/devops

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify branch
      run: |
        echo "Рабочая ветка: $(git branch --show-current)"
        echo "Сборка выполняется для ветки: feature/devops"

    - name: Build and test all modules
      run: mvn clean test

    - name: Build and test each module separately
      run: |
        for module in calculatorApp deal-service dossier-service gateway-service statement-service; do
          if [ -d "$module" ]; then
            echo "🧪 Тестирование модуля: $module в ветке feature/devops"
            mvn clean test -pl $module
          else
            echo " Модуль $module не найден в ветке feature/devops"
          fi
        done

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-devops-branch
        path: |
          **/target/surefire-reports
          **/target/failsafe-reports

    - name: Final status
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo " CI/CD пайплайн для ветки feature/devops выполнен успешно!"
        else
          echo " CI/CD пайплайн для ветки feature/devops завершился с ошибками"
          exit 1
        fi
