name: CI for Credit-Service 

on:
  push:
    branches: [ "develope/feature/devops" ]
  pull_request:
    branches: [ "develope/feature/devops" ]

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/db01
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: qwerty123
  SPRING_KAFKA_BOOTSTRAP-SERVERS: localhost:9092

jobs:
  run-application-tests:
    name: Run Application Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwerty123
          POSTGRES_DB: db01
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5433:5432" 

      zookeeper:
        image: zookeeper:3.7.0
        ports:
          - "2181:2181"

      kafka:
        image: obsidiandynamics/kafka
        env:
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092 
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
          KAFKA_BROKER_ID: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "nc -z localhost 29092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "9092:29092"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for test infrastructure
        run: |
          echo "Waiting for PostgreSQL..."
          until nc -z localhost 5433; do sleep 2; done
          
          echo "Waiting for Kafka..."
          sleep 15 # Ждем инициализации Kafka
          echo "Test infrastructure ready!"

      - name: Run application tests with coverage
        run: |
          # Запускаем тесты для всех модулей приложений
          ./mvnw clean test -pl deal-service,dossier-service,calculator-service,statement-service,gateway-service -am
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/db01
          SPRING_KAFKA_BOOTSTRAP-SERVERS: localhost:9092

      - name: Generate aggregated coverage report
        run: ./mvnw jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: run-application-tests
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all Docker images from compose
        run: docker compose -f docker-compose.yml build

      - name: List built images
        run: docker images

  run-containers:
    name: Run Containers
    runs-on: ubuntu-latest
    needs: build-docker-images
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start all containers
        run: docker compose -f docker-compose.yml up -d

      - name: Verify containers are running
        run: |
          sleep 20 # Даем время всем сервисам запуститься
          docker compose -f docker-compose.yml ps
          echo "Containers status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Check application health endpoints
        run: |
          # Проверяем health endpoints основных сервисов
          echo "Testing health endpoints..."
          curl -f http://localhost:8081/actuator/health || echo "Deal service health check failed"
          curl -f http://localhost:8000/actuator/health || echo "Dossier service health check failed" 
          curl -f http://localhost:8080/actuator/health || echo "Calculator service health check failed"
          curl -f http://localhost:8888/actuator/health || echo "Statement service health check failed"
          curl -f http://localhost:8989/actuator/health || echo "Gateway service health check failed"

      - name: Save container logs
        if: always()
        run: |
          docker compose -f docker-compose.yml logs > container-logs.txt
          echo "=== Container logs saved ==="

      - name: Upload container logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: container-logs.txt

      - name: Stop and cleanup containers
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
          echo "Containers stopped and cleaned up"
