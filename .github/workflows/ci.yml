name: CI

on:
  push:
    branches:
      - feature/devops
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout код
        uses: actions/checkout@v3
        with:
          ref: feature/devops
        
      - name: Переключиться на ветку develop/feature/devops
        run: git checkout feature/devops

      - name: Настроить JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Собрать модуль deal-service
        run: |
          cd calculatorApp
          mvn clean verify jacoco:report

      - name: Отправить отчёт о покрытии в Codecov
        run: bash <(curl -s https://codecov.io/bash) -t ${{ secrets.CODECOV_TOKEN }}

      - name: Проверка качества кода в SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB }}
        run: |
          cd calculatorApp
          mvn sonar:sonar \
            -Dsonar.organization=my-org \
            -Dsonar.projectKey=my-project \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
