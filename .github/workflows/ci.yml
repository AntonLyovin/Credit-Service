name: CI

on:
  push:
    branches:
      - feature/devops
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout код
        uses: actions/checkout@v3
        with:
          ref: feature/devops
        
      - name: Переключиться на ветку feature/devops (если нужно)
        run: git checkout feature/devops

      - name: Настроить JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Собрать и анализировать проект в SonarCloud
        run: |
          cd calculatorApp
          mvn clean verify jacoco:report
          mvn sonar:sonar \
            -Dsonar.organization=AntonLyovin \
            -Dsonar.projectKey=AntonLyovin_Credit-Service \
            -Dsonar.branch.name=feature/devops \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
     

      - name: Отправить отчёт о покрытии в Codecov
        run: bash <(curl -s https://codecov.io/bash) -t ${{ secrets.CODECOV_TOKEN }}
