name: CI for Credit-Service App

on:
  push:
    branches: [ "develope/feature/devops" ] 
  pull_request:
    branches: [ "develope/feature/devops" ] 

permissions:
  contents: read
  packages: write

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/db01
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: qwerty123
  SPRING_KAFKA_BOOTSTRAP-SERVERS: localhost:9092

jobs:
  test-and-build:
    name: Test, Build & Analyze
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13.8-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qwerty123
          POSTGRES_DB: db01
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5433:5432"

      zookeeper:
        image: zookeeper:3.7.0
        ports:
          - "2181:2181"

      kafka:
        image: obsidiandynamics/kafka
        env:
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
          KAFKA_BROKER_ID: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd "nc -z localhost 29092 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "9092:29092"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develope/feature/devops 

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate Dockerfiles and Compose
        run: |
          # Проверяем, что все необходимые Dockerfile существуют
          for service in deal-service dossier-service calculatorApp statement-service gateway-service; do
            if [ ! -f "$service/Dockerfile" ]; then
              echo "❌ ERROR: Dockerfile not found for service: $service"
              exit 1
            fi
            echo "✅ Found Dockerfile for $service"
          done
          # Проверяем существование compose-файлов
          ls -la docker-compose.yml docker-compose.test.yml
          echo "✅ All required files are present"

      - name: Wait for services to be ready
        run: |
          until nc -z localhost 5433; do
            sleep 2
          done
          echo "PostgreSQL is ready!"

          sleep 15 # Ждем инициализации Kafka
          echo "Kafka is assumed ready."

      - name: Run Tests with Coverage
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/db01
          SPRING_KAFKA_BOOTSTRAP-SERVERS: localhost:9092

      - name: Generate JaCoCo Report
        run: ./mvnw jacoco:report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # with:
        #   args: -Dsonar.branch.name=develope/feature/devops # Раскомментировать, если используете ветки в Sonar

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          file: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Build JARs
        run: ./mvnw package -DskipTests

  build-and-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-and-build 
    if: github.event_name == 'push' && github.ref == 'refs/heads/develope/feature/devops'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develope/feature/devops

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deal-service
            ${{ secrets.DOCKERHUB_USERNAME }}/dossier-service
            ${{ secrets.DOCKERHUB_USERNAME }}/calculator-service
            ${{ secrets.DOCKERHUB_USERNAME }}/statement-service
            ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service
          tags: |
            type=raw,value=latest
            type=raw,value=develop-{{date 'YYYYMMDD'}}-{{sha}}
            type=sha,enable=true,priority=100

      - name: Build and push individual services
        run: |
          # Собираем и пушим каждый сервис с тегами из предыдущего шага
          docker buildx build --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/deal-service:${{ steps.meta.outputs.tags }} \
            ./deal-service/

          docker buildx build --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/dossier-service:${{ steps.meta.outputs.tags }} \
            ./dossier-service/

          docker buildx build --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/calculator-service:${{ steps.meta.outputs.tags }} \
            ./calculatorApp/  # Обратите внимание на путь!

          docker buildx build --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/statement-service:${{ steps.meta.outputs.tags }} \
            ./statement-service/

          docker buildx build --push \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service:${{ steps.meta.outputs.tags }} \
            ./gateway-service/
