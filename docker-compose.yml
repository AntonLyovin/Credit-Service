version: "3.9"

services:
  db:
    image: postgres:13.8-alpine
    container_name: credit-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty123
      POSTGRES_DB: db01
    ports:
      - "5433:5432"
    networks:
      - mynet
  kafka:
    image: obsidiandynamics/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - mynet

  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - mynet

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32m -Xmx64m"
    depends_on:
      - kafka
    networks:
      - mynet

  deal-service:
    build: ./deal-service
    container_name: deal-service
    ports:
      - "8081:8081"
    networks:
      - mynet
    depends_on:
      - app1   # если app2 зависит от app1

  dossier-service:
    build: ./dossier-service
    container_name: dossier-service
    ports:
      - "8000:8000"
    networks:
      - mynet

  calculator-service:
    build: ./calculatorApp
    container_name: calculator-service
    ports:
      - "8080:8080"
    networks:
      - mynet

  statement-service:
    build: ./statement-service
    container_name: statement-service
    ports:
      - "8888:8888"
    networks:
      - mynet

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8989:8989"
    networks:
      - mynet

networks:
  mynet:
    driver: bridge