version: "3.9"

services:
  db:
    image: postgres:13.8-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty123
      POSTGRES_DB: db01
    ports:
      - "5433:5432"
    networks:
      - mynet
  zookeeper:
    image: zookeeper:3.7.0
    container_name: zookeeper1
    restart: "no"
    networks:
      - mynet
    ports:
      - "2181:2181"

  kafka:
    image: obsidiandynamics/kafka
    container_name: kafka1
    restart: "no"
    networks:
      - mynet
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER_INTERNAL:PLAINTEXT,DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafdrop:
      image: obsidiandynamics/kafdrop
      container_name: kafdrop1
      restart: "no"
      ports:
        - "9000:9000"
      environment:
        KAFKA_BROKERCONNECT: "kafka:29092"
      depends_on:
        - "kafka"
      networks:
        - mynet

  deal-service:
    build: ./deal-service
    container_name: deal-service
    ports:
      - "8081:8081"
    depends_on:
      - db
      - kafka
      - zookeeper
      - kafdrop
    networks:
      - mynet

  dossier-service:
    build: ./dossier-service
    container_name: dossier-service
    ports:
      - "8000:8000"
    depends_on:
      - deal-service
    networks:
      - mynet

  calculator-service:
    build: ./calculatorApp
    container_name: calculator-service
    ports:
      - "8080:8080"
    networks:
      - mynet

  statement-service:
    build: ./statement-service
    container_name: statement-service
    ports:
      - "8888:8888"
    depends_on:
      - deal-service
    networks:
      - mynet

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8989:8989"
    depends_on:
      - deal-service
    networks:
      - mynet

networks:
  mynet:
    driver: bridge